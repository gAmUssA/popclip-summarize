name: AI Summarize
identifier: io.gamov.popclip.extension.ai-summarize
# Original, provider-neutral artwork. Without a top-level icon PopClip uses the
# first action's, which would make the Claude mark this extension's identity.
icon: summarize.svg
shellScriptRationale: >-
  Shows summaries in a native AppKit floating panel and runs Apple's on-device
  FoundationModels, neither of which PopClip's JavaScript API can do. The engines
  are readable Swift source, compiled locally on first use; no binaries ship.
description: Summarize the selected text with Claude, OpenAI, or Grok (cloud), or Apple Intelligence (on-device).
keywords: summary summarize summarise tldr ai llm claude anthropic chatgpt openai gpt grok xai apple intelligence on-device
# 4586: every config feature used here predates it (secret options arrived in
# 4508); verified working on 5155. macOS 13: the cloud engines use Duration and
# ContinuousClock, and `make check` typechecks them against that target. The
# Apple Intelligence action separately requires macOS 26 at runtime.
popclip version: 4586
macos version: "13.0"
entitlements: [network]

options:
  - identifier: enginehead
    type: heading
    label: Claude

  - identifier: showclaude
    type: boolean
    label: Show Claude action
    default value: true
    description: >-
      Turn this off if you don't use Claude.

  - identifier: claudebackend
    type: multiple
    label: Backend
    default value: api
    values:
      - api
      - claude-code
    value labels:
      - API key (pay as you go)
      - Claude Code with your Claude plan (experimental)
    description: >-
      Experimental: uses the Claude Code you installed and logged in to with
      your Claude account, with every tool, hook, plugin, and MCP server turned
      off. Uses the Model setting below and counts against your plan's usage
      limits. The API key below is ignored in this mode.

  - identifier: apikey
    type: secret
    label: API Key
    description: >-
      Create a key at https://console.anthropic.com/settings/keys
      Stored in the macOS Keychain. Only the Claude action uses it.

  - identifier: model
    type: multiple
    label: Model
    default value: claude-haiku-4-5
    values:
      - claude-haiku-4-5
      - claude-sonnet-5
      - claude-opus-5
    value labels:
      - Haiku 4.5 — fastest, cheapest
      - Sonnet 5 — balanced
      - Opus 5 — highest quality

  - identifier: custommodel
    type: string
    label: Custom Model
    description: >-
      Optional. Any Anthropic model ID. Overrides the Model setting above.

  - identifier: openaihead
    type: heading
    label: OpenAI

  - identifier: showopenai
    type: boolean
    label: Show OpenAI action
    default value: true
    description: >-
      Needs an OpenAI API key. Turn this off if you don't use OpenAI.

  - identifier: openaibackend
    type: multiple
    label: Backend
    default value: api
    values:
      - api
      - codex
    value labels:
      - API key (pay as you go)
      - Codex CLI with your ChatGPT plan (experimental)
    description: >-
      Experimental: uses the Codex CLI you installed and signed in to with your
      ChatGPT account (`codex login`), with every Codex tool turned off. Slower
      than the API (about 5 seconds), counts against your plan's Codex limits,
      and ChatGPT's data controls apply instead of the API's. The API key and
      model settings below are ignored in this mode.

  - identifier: openaikey
    type: secret
    label: API Key
    description: >-
      Create a key at https://platform.openai.com/api-keys
      Stored in the macOS Keychain. Only the OpenAI action uses it.

  - identifier: openaimodel
    type: multiple
    label: Model
    default value: gpt-5.6-luna
    values:
      - gpt-5.6-luna
      - gpt-5.6-terra
      - gpt-5.6-sol
      - gpt-6-astra
    value labels:
      - GPT-5.6 Luna — fastest, cheapest
      - GPT-5.6 Terra — balanced
      - GPT-5.6 Sol — high quality
      - GPT-6 Astra — highest quality
    description: >-
      Reasoning is kept at the lowest effort each model allows; a summary
      gains nothing from deliberation.

  - identifier: openaicustommodel
    type: string
    label: Custom Model
    description: >-
      Optional. Any OpenAI model ID usable with the Responses API. Overrides
      the Model setting above.

  - identifier: xaihead
    type: heading
    label: Grok

  - identifier: showxai
    type: boolean
    label: Show Grok action
    default value: true
    description: >-
      Needs an xAI API key. Turn this off if you don't use Grok.

  - identifier: xaikey
    type: secret
    label: API Key
    description: >-
      Create a key at https://console.x.ai
      Stored in the macOS Keychain. Only the Grok action uses it.

  - identifier: xaimodel
    type: multiple
    label: Model
    default value: grok-4.3
    values:
      - grok-4.3
      - grok-4.5
      - grok-4.6
    value labels:
      - Grok 4.3 — fastest, cheapest
      - Grok 4.5 — balanced
      - Grok 4.6 — highest quality
    description: >-
      Reasoning is kept at the lowest effort each model allows; a summary
      gains nothing from deliberation.

  - identifier: xaicustommodel
    type: string
    label: Custom Model
    description: >-
      Optional. Any xAI model ID usable with the Responses API. Overrides the
      Model setting above.

  - identifier: applehead
    type: heading
    label: Apple Intelligence

  - identifier: showapple
    type: boolean
    label: Show Apple Intelligence action
    default value: true
    description: >-
      Requires macOS 26 or later on Apple silicon, with Apple Intelligence
      turned on in System Settings. Runs fully on-device — no API key, no
      network, no cost. Turn this off to hide the action on unsupported Macs.

  - identifier: summaryhead
    type: heading
    label: Summary

  - identifier: style
    type: multiple
    label: Style
    default value: concise
    values:
      - concise
      - bullets
      - tldr
    value labels:
      - Concise paragraph
      - Bullet points
      - One-line TL;DR

  - identifier: extra
    type: string
    label: Extra Instructions
    description: >-
      Optional. Appended to the prompt for every engine.
      Example: "Reply in French." or "Keep all product names verbatim."

  - identifier: output
    type: multiple
    label: Result
    default value: window
    values:
      - window
      - fullscreen
      - copy
    value labels:
      - Summary window
      - Full screen
      - Copy to clipboard only
    description: >-
      The summary window is a floating panel you can select text in, resize,
      and dismiss with Escape. Full screen is large type: the text scaled up to
      fill the display, dismissed with Escape or a click. Every setting puts the
      summary on the clipboard, so ⌘V works afterwards. Applies to every engine.

  # Shown at the foot of the settings so a bug report can name the build.
  # `make release` refuses to tag unless this matches the release version.
  - identifier: versionhead
    type: heading
    label: AI Summarize 1.0.1 · github.com/gAmUssA/popclip-summarize

# All actions are shell scripts: the result panel is AppKit and the on-device
# engine is FoundationModels, both native code PopClip's JavaScript can't run.
# (PopClip 6221 lets JavaScript start a shell script, but that would only add a
# hop in front of the same native code.) The cloud engines are Swift too, so
# every engine shares one contract and one viewer. No action declares `after:` —
# the wrapper does its own delivering.
actions:
  - title: Summarize (Claude)
    icon: claude.svg
    shell script file: summarize-claude.sh
    requirements: [text, option-showclaude=1]

  - title: Summarize (OpenAI)
    icon: openai.svg
    shell script file: summarize-openai.sh
    requirements: [text, option-showopenai=1]

  - title: Summarize (Grok)
    icon: grok.svg
    shell script file: summarize-grok.sh
    requirements: [text, option-showxai=1]

  - title: Summarize (Apple Intelligence)
    icon: on-device.svg
    shell script file: summarize-apple.sh
    requirements: [text, option-showapple=1]
