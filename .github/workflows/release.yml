name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags must be present for `git describe`

      - name: Validate extension
        run: make check

      - name: Verify the build version matches the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(make version)"
          if [ "$expected" != "$actual" ]; then
            echo "Tag $GITHUB_REF_NAME implies version '$expected'," \
                 "but the build produces '$actual'." >&2
            echo "Refusing to publish a mislabelled artifact." >&2
            exit 1
          fi
          echo "version check ok: $actual"
          shown="$(ruby scripts/config-version.rb)"
          if [ "$expected" != "$shown" ]; then
            echo "Config.yaml's settings heading shows '$shown', not '$expected'." >&2
            exit 1
          fi

      - name: Build versioned package
        run: |
          make package
          ls -l dist/

      - name: Extract this version's changelog section
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          : > release-notes.md
          # Pull the body of "## [x.y.z]" up to the next "## " heading. The
          # version is interpolated into a regex, so escape its dots first —
          # otherwise "## [1x2y3]" would match the tag 1.2.3.
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              BEGIN { gsub(/\./, "\\.", v) }
              $0 ~ "^## \\[" v "\\]" { grab = 1; next }
              grab && /^## / { exit }
              grab { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "No changelog section for $version; falling back to generated notes."
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.notes.outputs.generated }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.popclipextz \
              --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" dist/*.popclipextz \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
